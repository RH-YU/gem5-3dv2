  <path class="data" d="M1186 334 C1244 334, 1244 182, 1410 182"/>
  <path class="data" d="M1186 486 C1226 486, 1226 410, 1260 410"/>
  <path class="data" d="M1186 486 C1238 486, 1238 410, 1400 410"/>
  <path class="data" d="M1186 486 C1248 486, 1248 530, 1328 530"/>
  <path class="data" d="M1186 562 C1230 562, 1230 530, 1328 530"/>
