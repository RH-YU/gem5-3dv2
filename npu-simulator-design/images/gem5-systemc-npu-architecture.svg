  <text class="tiny" x="1214" y="246">MTE4: GM -> UB/L1</text>
  <text class="tiny" x="1214" y="360">MTE1: L1 -> GM/UB/L0A/L0B</text>
  <text class="tiny" x="1214" y="486">Cube: L0A/L0B -> L0C</text>
  <text class="tiny" x="1214" y="610">Fixpipe: L0C -> L1/UB</text>
  <text class="tiny" x="1214" y="684">NIU: packetize UB/GM + remote sync</text>
</svg>
