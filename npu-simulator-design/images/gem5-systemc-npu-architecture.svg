  <path class="route" d="M956 564 L1018 564"/>
  <path class="route" d="M956 640 L1018 640"/>

  <path class="sync-line" d="M626 424 L806 184"/>
  <path class="sync-line" d="M626 424 L806 260"/>
  <path class="sync-line" d="M626 424 L806 336"/>
  <path class="sync-line" d="M626 424 L806 412"/>
