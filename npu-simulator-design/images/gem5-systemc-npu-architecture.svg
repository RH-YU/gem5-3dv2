  <path class="data" d="M1186 562 C1278 562, 1288 182, 1410 182"/>
  <path class="data" d="M1186 638 C1228 638, 1228 182, 1260 182"/>

  <text class="tiny" x="1214" y="246">MTE4: GM -> UB/L1</text>
  <text class="tiny" x="1214" y="360">MTE1: L1 -> GM/UB/L0A/L0B</text>
  <text class="tiny" x="1214" y="470">Cube: L0A/L0B -> L0C</text>
  <text class="tiny" x="1214" y="594">Fixpipe: L0C -> L1/UB</text>
</svg>
