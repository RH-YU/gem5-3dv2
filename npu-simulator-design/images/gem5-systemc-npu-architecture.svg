  <path class="sync-line" d="M626 424 L806 716"/>
  <path class="sync-line" d="M506 484 C440 484, 424 708, 392 708"/>

  <path class="data" d="M1186 182 L1260 182"/>
  <path class="data" d="M1186 190 C1240 190, 1240 296, 1260 296"/>
  <path class="data" d="M1186 258 C1228 258, 1228 296, 1260 296"/>
