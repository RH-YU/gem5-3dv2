<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">gem5 + SystemC NPU architecture</title>
  <desc id="desc">Current implementation architecture for direct XAI command dispatch, bounded queues, engine execution, sync tokens, CPU backpressure, AICore local memory data paths, and NIU/NOC interconnect.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c2410c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .domain { fill: none; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; rx: 8; }
      .gem5 { fill: #eff6ff; stroke: #2563eb; }
      .cluster { fill: #eef2ff; stroke: #4f46e5; }
      .sched { fill: #fff7ed; stroke: #ea580c; }
      .queue { fill: #fffbeb; stroke: #d97706; }
      .engine { fill: #fdf2f8; stroke: #db2777; }
      .storage { fill: #f0fdf4; stroke: #16a34a; }
      .sync { fill: #fefce8; stroke: #ca8a04; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .cmd { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .route { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow-dark); }
      .data { stroke: #15803d; stroke-width: 2.3; fill: none; marker-end: url(#arrow-green); }
      .sync-line { stroke: #c2410c; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-orange); }
      .backpressure { stroke: #dc2626; stroke-width: 2.2; fill: none; stroke-dasharray: 8 5; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>
  <text class="title" x="42" y="48">gem5 + SystemC NPU 当前实现框图</text>
  <text class="subtitle" x="42" y="76">direct XAI/RVV NPU submit, per-NPU scheduler, MTE/VCU/Cube/Fixpipe/NIU/NOC engines, L1/L0/UB/GM storage, sync token, ReExec backpressure</text>

  <rect class="domain" x="40" y="110" width="390" height="900"/>
  <text class="section-title" x="64" y="143">gem5 CPU / ISA / NPU Device</text>

  <rect class="box gem5" x="78" y="178" width="314" height="74"/>
  <text class="label" x="102" y="207">Bare-metal RV64 CPU</text>
  <text class="small" x="102" y="231">runs XAI + RVV NPU ELF, retires async NPU commands</text>

  <rect class="box gem5" x="78" y="286" width="314" height="86"/>
  <text class="label" x="102" y="316">XAI + RVV NPU decoders</text>
  <text class="small" x="102" y="340">decoder.isa + vector/npu</text>
  <text class="small" x="102" y="360">formats/xai.isa captures GPR values</text>

  <rect class="box gem5" x="78" y="406" width="314" height="88"/>
  <text class="label" x="102" y="436">sendXaiCommandDirect()</text>
  <text class="small" x="102" y="460">submitNpuCommandDirect(command)</text>
  <text class="small" x="102" y="480">Backpressured -> ReExec retry</text>

  <rect class="box cluster" x="78" y="528" width="314" height="98"/>
  <text class="label" x="102" y="558">NpuDevice / NpuCluster</text>
  <text class="small" x="102" y="582">masked NPU broadcast</text>
  <text class="small" x="102" y="604">checks all target NPUs before submit</text>

  <rect class="box sync" x="78" y="660" width="314" height="96"/>
  <text class="label" x="102" y="690">CPU sync endpoint</text>
  <text class="small" x="102" y="714">sync_set / sync_wait can target Cpu</text>
  <text class="small" x="102" y="736">used to wait for NPU completion before m5_exit</text>

  <rect class="note" x="78" y="790" width="314" height="48"/>
  <text class="small" x="102" y="819">CPU stalls only when NPU cannot accept a command</text>

  <rect class="domain" x="470" y="110" width="1088" height="900"/>
  <text class="section-title" x="494" y="143">SystemC NPU instance, replicated per NPU</text>

  <rect class="box sched" x="506" y="178" width="240" height="76"/>
  <text class="label" x="532" y="207">NpuTop::submit()</text>
  <text class="small" x="532" y="231">bounded ingress FIFO</text>

  <rect class="box sched" x="506" y="292" width="240" height="94"/>
  <text class="label" x="532" y="322">Scheduler</text>
  <text class="small" x="532" y="346">route by coarse Opcode</text>
  <text class="small" x="532" y="368">dispatch to per-engine FIFO</text>

  <rect class="box sync" x="506" y="424" width="240" height="108"/>
  <text class="label" x="532" y="454">Sync state</text>
  <text class="small" x="532" y="478">token: src, dst, id</text>
  <text class="small" x="532" y="500">sync state only tracks the token</text>
  <text class="small" x="532" y="520">set / wait consume the token</text>

  <rect class="box queue" x="806" y="156" width="150" height="56"/>
  <text class="label" x="846" y="186">MTE4 FIFO</text>
  <text class="tiny" x="832" y="204">GM -> UB/L1</text>

  <rect class="box queue" x="806" y="232" width="150" height="56"/>
  <text class="label" x="846" y="262">MTE1 FIFO</text>
  <text class="tiny" x="818" y="280">L1 -> GM/UB/L0</text>

  <rect class="box queue" x="806" y="308" width="150" height="56"/>
  <text class="label" x="846" y="338">MTE2 FIFO</text>
  <text class="tiny" x="826" y="356">UB -> GM/L1</text>

  <rect class="box queue" x="806" y="384" width="150" height="56"/>
  <text class="label" x="850" y="414">VCU FIFO</text>
  <text class="tiny" x="812" y="432">vsetvli/vle32/vadd/vse32</text>

  <rect class="box queue" x="806" y="460" width="150" height="56"/>
  <text class="label" x="846" y="490">Cube FIFO</text>
  <text class="tiny" x="824" y="508">8x16 @ 16x16 fp32</text>

  <rect class="box queue" x="806" y="536" width="150" height="56"/>
  <text class="label" x="830" y="566">Fixpipe FIFO</text>
  <text class="tiny" x="824" y="584">L0C -> L1/UB</text>

  <rect class="box queue" x="806" y="612" width="150" height="56"/>
  <text class="label" x="820" y="642">GM File I/O FIFO</text>
  <text class="tiny" x="826" y="660">test import/export</text>

  <rect class="box queue" x="806" y="688" width="150" height="56"/>
  <text class="label" x="852" y="718">NIU FIFO</text>
  <text class="tiny" x="832" y="736">packetized UB/GM transfer</text>

  <rect class="box engine" x="1018" y="148" width="168" height="68"/>
  <text class="label" x="1055" y="178">MTE4 thread</text>
  <text class="tiny" x="1040" y="199">copy GM to UB/L1</text>

  <rect class="box engine" x="1018" y="224" width="168" height="68"/>
  <text class="label" x="1055" y="254">MTE1 thread</text>
  <text class="tiny" x="1032" y="275">copy L1 to GM/UB/L0</text>

  <rect class="box engine" x="1018" y="300" width="168" height="68"/>
  <text class="label" x="1055" y="330">MTE2 thread</text>
  <text class="tiny" x="1040" y="351">copy UB to GM/L1</text>

  <rect class="box engine" x="1018" y="376" width="168" height="86"/>
  <text class="label" x="1062" y="406">VCU thread</text>
  <text class="tiny" x="1038" y="427">vsetvl enters VCU FIFO</text>
  <text class="tiny" x="1038" y="445">owns nvl/eew_bytes</text>

  <rect class="box engine" x="1018" y="468" width="168" height="68"/>
  <text class="label" x="1056" y="498">Cube thread</text>
  <text class="tiny" x="1037" y="519">fp32 matmul to L0C</text>

  <rect class="box engine" x="1018" y="544" width="168" height="68"/>
  <text class="label" x="1048" y="574">Fixpipe thread</text>
  <text class="tiny" x="1040" y="595">copy L0C to L1/UB</text>

  <rect class="box engine" x="1018" y="620" width="168" height="68"/>
  <text class="label" x="1032" y="650">GM File I/O thread</text>
  <text class="tiny" x="1036" y="671">host file bridge for tests</text>

  <rect class="box engine" x="1018" y="696" width="168" height="68"/>
  <text class="label" x="1058" y="726">NIU thread</text>
  <text class="tiny" x="1036" y="747">packetize data and sync token</text>

  <rect class="box storage" x="1260" y="154" width="122" height="62"/>
  <text class="label" x="1300" y="184">GM</text>
  <text class="tiny" x="1282" y="204">SparseMemory</text>

  <rect class="box storage" x="1410" y="154" width="112" height="62"/>
  <text class="label" x="1454" y="184">UB</text>
  <text class="tiny" x="1432" y="204">FlatMemory</text>

  <rect class="box storage" x="1260" y="264" width="262" height="66"/>
  <text class="label" x="1376" y="294">L1</text>
  <text class="tiny" x="1328" y="316">512KB FlatMemory</text>

  <rect class="box storage" x="1260" y="380" width="122" height="62"/>
  <text class="label" x="1296" y="410">L0A</text>
  <text class="tiny" x="1288" y="430">64KB A input</text>

  <rect class="box storage" x="1400" y="380" width="122" height="62"/>
  <text class="label" x="1436" y="410">L0B</text>
  <text class="tiny" x="1428" y="430">64KB B input</text>

  <rect class="box storage" x="1328" y="500" width="122" height="62"/>
  <text class="label" x="1364" y="530">L0C</text>
  <text class="tiny" x="1356" y="550">64KB output</text>

  <rect class="note" x="506" y="772" width="328" height="82"/>
  <text class="label" x="532" y="802">Backpressure rule</text>
  <text class="small" x="532" y="826">can_accept = ingress space + target FIFO space</text>
  <text class="small" x="532" y="846">failure returns ReExec to retry same XAI instruction</text>

  <rect class="note" x="876" y="772" width="312" height="82"/>
  <text class="label" x="902" y="802">NOC interconnect</text>
  <text class="small" x="902" y="826">bidirectional ring, per-hop capacity</text>
  <text class="small" x="902" y="846">128B packet granularity</text>

  <rect class="note" x="506" y="876" width="328" height="82"/>
  <text class="label" x="532" y="906">Async execution rule</text>
  <text class="small" x="532" y="930">accepted non-sync commands do not wait for engine done</text>
  <text class="small" x="532" y="950">software uses set/wait for data dependency</text>

  <rect class="note" x="876" y="876" width="312" height="82"/>
  <text class="label" x="902" y="906">NIU / NOC path</text>
  <text class="small" x="902" y="930">packet_sent -> inject -> deliver -> packet_received</text>
  <text class="small" x="902" y="950">ack closes packet lifetime and advances the source NIU</text>

  <path class="cmd" d="M235 252 L235 286"/>
  <path class="cmd" d="M235 372 L235 406"/>
  <path class="cmd" d="M235 494 L235 528"/>
  <path class="cmd" d="M392 577 C440 577, 444 216, 506 216"/>
  <path class="backpressure" d="M506 205 C444 205, 440 450, 392 450"/>

