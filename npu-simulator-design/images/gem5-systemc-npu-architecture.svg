  <path class="sync-line" d="M626 424 L806 564"/>
  <path class="sync-line" d="M626 424 L806 640"/>
  <path class="sync-line" d="M506 484 C440 484, 424 708, 392 708"/>

  <path class="data" d="M1186 182 L1260 182"/>
  <path class="data" d="M1186 190 C1240 190, 1240 296, 1260 296"/>
  <path class="data" d="M1186 258 C1228 258, 1228 296, 1260 296"/>
  <path class="data" d="M1186 258 C1240 258, 1240 182, 1410 182"/>
  <path class="data" d="M1186 258 C1220 258, 1220 410, 1260 410"/>
  <path class="data" d="M1186 258 C1236 258, 1236 410, 1400 410"/>
